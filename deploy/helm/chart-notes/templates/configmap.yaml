{{- if .Values.charts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-notes.fullname" . }}-charts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart-notes.labels" . | nindent 4 }}
data:
  charts.json: |
    {{- toPrettyJson .Values.charts | nindent 4 }}
{{- end }}
