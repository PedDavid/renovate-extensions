name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chart-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s chart-notes/tests -v

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/chart-notes
      - run: helm template chart-notes deploy/helm/chart-notes --set ingress.enabled=true --set github.existingSecret=x --set-json 'charts={"x":{"repo":"https://example.com","app":"a/b"}}' >/dev/null

  image:
    runs-on: ubuntu-latest
    needs: chart-notes
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: chart-notes
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
