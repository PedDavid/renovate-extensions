apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-notes.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart-notes.labels" . | nindent 4 }}
spec:
  # One replica: the cache is per process, and each replica would spend its
  # own share of GitHub's rate limit.
  replicas: 1
  selector:
    matchLabels:
      {{- include "chart-notes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart-notes.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Overrides are read once at startup: roll the pod when they change.
        checksum/overrides: {{ toJson .Values.overrides | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: chart-notes
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CHART_NOTES_CACHE_TTL
              value: {{ .Values.cacheTtl | quote }}
            {{- with include "chart-notes.publicUrl" . }}
            - name: CHART_NOTES_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.overrides }}
            - name: CHART_NOTES_OVERRIDES_FILE
              value: /etc/chart-notes/overrides/overrides.json
            {{- end }}
            {{- if .Values.github.existingSecret }}
            - name: CHART_NOTES_GITHUB_TOKEN_FILE
              value: /etc/chart-notes/github/{{ .Values.github.key }}
            {{- end }}
            {{- if .Values.logJson }}
            - name: CHART_NOTES_LOG_JSON
              value: "true"
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.overrides .Values.github.existingSecret }}
          volumeMounts:
            {{- if .Values.overrides }}
            - name: overrides
              mountPath: /etc/chart-notes/overrides
              readOnly: true
            {{- end }}
            {{- if .Values.github.existingSecret }}
            - name: github
              mountPath: /etc/chart-notes/github
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.overrides .Values.github.existingSecret }}
      volumes:
        {{- if .Values.overrides }}
        - name: overrides
          configMap:
            name: {{ include "chart-notes.fullname" . }}-overrides
        {{- end }}
        {{- if .Values.github.existingSecret }}
        - name: github
          secret:
            secretName: {{ .Values.github.existingSecret }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
