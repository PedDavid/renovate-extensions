name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  chart-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The chart's default image tag is its appVersion, so that tag must
      # exist as soon as the chart is on main: publish it the first time a
      # new appVersion is seen (a version bump), and never overwrite it.
      - id: version
        run: |
          app=$(yq '.appVersion' deploy/helm/chart-notes/Chart.yaml)
          image="ghcr.io/${GITHUB_REPOSITORY,,}/chart-notes"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image:$app" >/dev/null 2>&1; then
            echo "first=false" >> "$GITHUB_OUTPUT"
          else
            echo "first=true" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=sha
            type=raw,value=main
            type=raw,value=${{ steps.version.outputs.app }},enable=${{ steps.version.outputs.first == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: chart-notes
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The chart's default image exists
        run: docker buildx imagetools inspect "${{ steps.version.outputs.image }}:${{ steps.version.outputs.app }}"
