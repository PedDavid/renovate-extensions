<div class="flex flex-wrap items-center gap-2 text-sm text-muted-foreground">
  {% if !chart.app.is_empty() %}<span>App <a class="underline underline-offset-4 hover:text-foreground" href="{{ chart.app_url }}" target="_blank" rel="noopener noreferrer">{{ chart.app }}</a></span>
  <span aria-hidden="true">·</span>{% endif %}
  <span>Chart from <code class="text-xs" title="{{ chart.repo }}">{{ chart.repo_host }}</code>{% if !chart.source.is_empty() %}, released from <code class="text-xs">{{ chart.source }}</code>{% endif %}</span>
</div>
