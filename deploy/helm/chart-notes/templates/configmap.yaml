{{- if .Values.overrides }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-notes.fullname" . }}-overrides
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart-notes.labels" . | nindent 4 }}
data:
  overrides.json: |
    {{- toPrettyJson .Values.overrides | nindent 4 }}
{{- end }}
