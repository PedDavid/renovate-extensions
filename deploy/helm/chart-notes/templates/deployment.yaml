apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "chart-notes.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chart-notes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart-notes.selectorLabels" . | nindent 8 }}
      {{- if .Values.charts }}
      annotations:
        # Roll the pod when the charts change; they're read once at startup.
        checksum/charts: {{ toJson .Values.charts | sha256sum }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chart-notes
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.charts }}
            - name: CHARTS_FILE
              value: /etc/chart-notes/charts.json
            {{- end }}
            {{- if .Values.github.existingSecret }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: {{ .Values.github.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.charts }}
          volumeMounts:
            - name: charts
              mountPath: /etc/chart-notes
              readOnly: true
          {{- end }}
      {{- if .Values.charts }}
      volumes:
        - name: charts
          configMap:
            name: {{ .Release.Name }}
      {{- end }}
