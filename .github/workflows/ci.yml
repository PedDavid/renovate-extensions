name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rustup reads the toolchain and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make check
    env:
      # The browser tests are ignored here; the visual job runs them.
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"

  visual:
    # Pinned so fonts and rendering only change when the baselines do.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Chromium for the pinned Playwright driver
        run: cargo run --locked --package chart-notes --example install-browsers -- chromium --with-deps
      - name: Browser tests (palette and screenshots)
        run: make visual
      # On failure: each -actual.png and -diff.png. New baselines come from
      # the Screenshots workflow (label the PR update-screenshots).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: screenshots
          path: chart-notes/tests/screenshots/
          if-no-files-found: ignore

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: make helm-lint

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: CSS is up to date
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          make css
          git diff --exit-code chart-notes/assets/dist/app.css

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: chart-notes/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
