[package]
name = "chart-notes"
version = "0.5.0"
edition = "2024"

[dependencies]
ammonia = "4.1.2"
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.5"
futures = "0.3.34"
jiff = { version = "0.2.37", features = ["serde"] }
mime_guess = "2.0.5"
prometheus-client = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
similar = "2.7.0"
tar = "0.4.44"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }

axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
askama = "0.16"

[dev-dependencies]
http-body-util = "0.1.5"
insta = { version = "1.48.0", features = ["filters"] }
playwright-rs = { version = "=0.18.1", default-features = false, features = ["aws-lc", "route-service", "screenshot-diff"] }
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
